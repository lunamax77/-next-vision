<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>位置情報デモ — 管理ダッシュボード</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36;
    --text: #e6e9ef; --muted: #8b93a7; --accent: #4c9aff; --live: #3ddc84; --off: #4a5163;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); }
  .dot.on { background: var(--live); box-shadow: 0 0 8px var(--live); }
  .spacer { flex: 1; }
  input, button, select {
    background: #10131a; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px; font-size: 13px; font-family: inherit;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  main { flex: 1; display: flex; min-height: 0; }
  #map { flex: 1; background: #0b0d11; }
  aside { width: 320px; border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; }
  .device {
    padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .device:hover { background: #1c2029; }
  .device.sel { background: #1c2431; border-left: 3px solid var(--accent); padding-left: 11px; }
  .device .name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .device .meta { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.6; }
  .badge {
    font-size: 10px; padding: 1px 6px; border-radius: 999px;
    background: var(--off); color: #fff; font-weight: 500;
  }
  .badge.live { background: var(--live); color: #06240f; }
  .empty { padding: 24px 16px; color: var(--muted); font-size: 13px; line-height: 1.8; }
  #banner {
    padding: 8px 16px; background: #2a2010; color: #f0c674;
    font-size: 12px; border-bottom: 1px solid var(--line); display: none;
  }
  .leaflet-popup-content { font-size: 12px; line-height: 1.6; }
</style>
</head>
<body>
<header>
  <h1>位置情報デモ — 管理ダッシュボード</h1>
  <span class="status"><span class="dot" id="dot"></span><span id="conn">未接続</span></span>
  <div class="spacer"></div>
  <label class="status">履歴
    <select id="minutes">
      <option value="30">30分</option>
      <option value="120" selected>2時間</option>
      <option value="480">8時間</option>
      <option value="1440">24時間</option>
    </select>
  </label>
  <input id="token" type="password" placeholder="ADMIN_TOKEN" size="18">
  <button id="connect">接続</button>
</header>
<div id="banner"></div>
<main>
  <div id="map"></div>
  <aside id="list"><div class="empty">ADMIN_TOKEN を入れて「接続」を押してください。</div></aside>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const state = {
    token: new URL(location.href).searchParams.get('token') || localStorage.getItem('adminToken') || '',
    devices: new Map(),   // deviceId -> { info, marker, circle, polyline }
    selected: null,
    es: null,
    map: null,
  };

  // ---- 地図。CDN が届かない環境ではリスト表示だけで動かす。
  function initMap() {
    if (typeof L === 'undefined') {
      $('banner').style.display = 'block';
      $('banner').textContent =
        '地図ライブラリ (Leaflet CDN) を読み込めませんでした。座標はリストで確認できます。';
      // 地図が出せないなら黒い枠を残さず、リストを全幅にする
      $('map').style.display = 'none';
      document.querySelector('aside').style.width = '100%';
      document.querySelector('aside').style.borderLeft = 'none';
      return false;
    }
    state.map = L.map('map', { zoomControl: true }).setView([35.681236, 139.767125], 12);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors',
    }).addTo(state.map);
    return true;
  }
  const hasMap = initMap();

  const fmtTime = (ms) =>
    new Date(ms).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const ago = (ms) => {
    const s = Math.round((Date.now() - ms) / 1000);
    if (s < 60) return `${s}秒前`;
    if (s < 3600) return `${Math.round(s / 60)}分前`;
    return `${Math.round(s / 3600)}時間前`;
  };

  async function api(pathname, params = {}) {
    const url = new URL(pathname, location.origin);
    for (const [k, v] of Object.entries(params)) url.searchParams.set(k, v);
    const res = await fetch(url, { headers: { authorization: `Bearer ${state.token}` } });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
    return res.json();
  }

  function colorFor(deviceId) {
    let h = 0;
    for (const ch of deviceId) h = (h * 31 + ch.charCodeAt(0)) % 360;
    return `hsl(${h}, 70%, 58%)`;
  }

  function upsertDevice(info) {
    const prev = state.devices.get(info.deviceId) || {};
    const prevInfo = prev.info || {};
    const merged = { ...prevInfo, ...info };

    // 一覧の再取得(非同期)と SSE の位置イベントは順番が前後する。
    // 古いレスポンスが新しい位置を消さないよう、新しい方を残す。
    const prevAt = prevInfo.latest ? prevInfo.latest.recordedAt : -Infinity;
    const nextAt = info.latest ? info.latest.recordedAt : -Infinity;
    if (prevAt > nextAt) merged.latest = prevInfo.latest;
    merged.pointCount = Math.max(prevInfo.pointCount || 0, info.pointCount || 0);

    info = merged;
    const entry = { ...prev, info };
    state.devices.set(info.deviceId, entry);

    if (hasMap && info.latest) {
      const { lat, lon, accuracy } = info.latest;
      const color = colorFor(info.deviceId);
      if (!entry.marker) {
        entry.marker = L.circleMarker([lat, lon], {
          radius: 8, color: '#fff', weight: 2, fillColor: color, fillOpacity: 1,
        }).addTo(state.map);
        entry.circle = L.circle([lat, lon], {
          radius: accuracy || 0, color, weight: 1, fillOpacity: 0.08,
        }).addTo(state.map);
        entry.marker.on('click', () => select(info.deviceId));
      } else {
        entry.marker.setLatLng([lat, lon]);
        entry.circle.setLatLng([lat, lon]).setRadius(accuracy || 0);
      }
      entry.marker.bindPopup(
        `<b>${escapeHtml(info.deviceName || info.deviceId)}</b><br>` +
        `${lat.toFixed(6)}, ${lon.toFixed(6)}<br>` +
        `精度 ±${Math.round(accuracy || 0)}m<br>${fmtTime(info.latest.recordedAt)}`
      );
    }
    render();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  }

  function render() {
    const list = $('list');
    if (!state.devices.size) {
      list.innerHTML = '<div class="empty">まだ端末からの送信がありません。<br>スマホ側で「共有を開始」してください。</div>';
      return;
    }
    const rows = [...state.devices.values()]
      .sort((a, b) => (b.info.lastSeen || 0) - (a.info.lastSeen || 0))
      .map(({ info }) => {
        const l = info.latest;
        return `
        <div class="device ${state.selected === info.deviceId ? 'sel' : ''}" data-id="${escapeHtml(info.deviceId)}">
          <div class="name">
            <span style="color:${colorFor(info.deviceId)}">●</span>
            ${escapeHtml(info.deviceName || info.deviceId)}
            <span class="badge ${info.sharing ? 'live' : ''}">${info.sharing ? '共有中' : '停止中'}</span>
          </div>
          <div class="meta">
            ${l ? `${l.lat.toFixed(5)}, ${l.lon.toFixed(5)} (±${Math.round(l.accuracy || 0)}m)<br>` : '位置なし<br>'}
            ${l ? `最終: ${fmtTime(l.recordedAt)} (${ago(l.recordedAt)})<br>` : ''}
            ${info.platform ? `${escapeHtml(info.platform)} · ` : ''}${info.pointCount ?? 0} 点
            ${l && l.battery != null ? ` · 電池 ${Math.round(l.battery * 100)}%` : ''}
          </div>
        </div>`;
      })
      .join('');
    list.innerHTML = rows;
    list.querySelectorAll('.device').forEach((el) =>
      el.addEventListener('click', () => select(el.dataset.id)));
  }

  async function select(deviceId) {
    state.selected = deviceId;
    render();
    const entry = state.devices.get(deviceId);
    if (!entry) return;
    if (hasMap && entry.info.latest) {
      state.map.setView([entry.info.latest.lat, entry.info.latest.lon], Math.max(state.map.getZoom(), 15));
    }
    // 選択した端末の軌跡を描く
    try {
      const { points } = await api(`/api/v1/devices/${encodeURIComponent(deviceId)}/track`, {
        minutes: $('minutes').value,
      });
      if (!hasMap) return;
      if (entry.polyline) state.map.removeLayer(entry.polyline);
      if (points.length > 1) {
        entry.polyline = L.polyline(points.map((p) => [p.lat, p.lon]), {
          color: colorFor(deviceId), weight: 3, opacity: 0.7,
        }).addTo(state.map);
        state.map.fitBounds(entry.polyline.getBounds(), { padding: [40, 40] });
      }
    } catch (err) {
      console.warn('軌跡の取得に失敗:', err.message);
    }
  }

  function setConn(on, text) {
    $('dot').classList.toggle('on', on);
    $('conn').textContent = text;
  }

  async function connect() {
    state.token = $('token').value.trim() || state.token;
    if (!state.token) return alert('ADMIN_TOKEN を入れてください');
    localStorage.setItem('adminToken', state.token);

    try {
      const { devices } = await api('/api/v1/devices');
      state.devices.clear();
      devices.forEach(upsertDevice);
      if (!devices.length) render();
    } catch (err) {
      setConn(false, '認証エラー');
      return alert(`接続できません: ${err.message}`);
    }

    if (state.es) state.es.close();
    const es = new EventSource(`/api/v1/stream?token=${encodeURIComponent(state.token)}`);
    state.es = es;

    es.addEventListener('hello', () => setConn(true, 'リアルタイム受信中'));
    es.addEventListener('point', (ev) => {
      const p = JSON.parse(ev.data);
      const prev = state.devices.get(p.deviceId)?.info || {};
      upsertDevice({
        deviceId: p.deviceId,
        deviceName: p.deviceName,
        sharing: true,
        lastSeen: Date.now(),
        pointCount: (prev.pointCount || 0) + (p.batchSize || 1),
        platform: prev.platform,
        latest: {
          lat: p.lat, lon: p.lon, accuracy: p.accuracy,
          battery: p.battery, recordedAt: p.recordedAt,
        },
      });
      if (state.selected === p.deviceId) select(p.deviceId);
    });
    es.addEventListener('session', (ev) => {
      const s = JSON.parse(ev.data);
      const prev = state.devices.get(s.deviceId)?.info;
      if (prev) upsertDevice({ ...prev, sharing: s.state === 'started' });
      else api('/api/v1/devices').then(({ devices }) => devices.forEach(upsertDevice)).catch(() => {});
    });
    es.addEventListener('forget', (ev) => {
      const { deviceId } = JSON.parse(ev.data);
      const entry = state.devices.get(deviceId);
      if (entry && hasMap) {
        [entry.marker, entry.circle, entry.polyline].forEach((l) => l && state.map.removeLayer(l));
      }
      state.devices.delete(deviceId);
      render();
    });
    es.onerror = () => setConn(false, '再接続中...');
  }

  $('connect').addEventListener('click', connect);
  $('token').addEventListener('keydown', (e) => e.key === 'Enter' && connect());
  $('minutes').addEventListener('change', () => state.selected && select(state.selected));
  setInterval(render, 10_000); // 「◯分前」を更新

  if (state.token) {
    $('token').value = state.token;
    connect();
  }
})();
</script>
</body>
</html>
