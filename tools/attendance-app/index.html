<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>勤怠確認</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#111013;
    --surface:#18171b;
    --surface-2:#201f24;
    --border:#2e2c31;
    --border-soft:#26242a;
    --text:#f1efe9;
    --text-sub:#938f92;
    --text-faint:#615e63;
    --accent:#c7a15f;
    --accent-dim:#8a7548;
    --ok:#7fae8e;
    --danger:#c47a6c;
  }
  *{box-sizing:border-box;}
  html,body{background:var(--bg);}
  body{
    margin:0;
    font-family:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }

  .app{
    max-width:440px;
    margin:0 auto;
    padding:36px 22px 48px;
  }

  header{
    display:flex;
    flex-direction:column;
    gap:6px;
    padding-bottom:28px;
    border-bottom:1px solid var(--border-soft);
    margin-bottom:28px;
  }
  .eyebrow{
    font-size:10.5px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--text-faint);
  }
  header h1{
    font-family:"Shippori Mincho",serif;
    font-weight:600;
    font-size:23px;
    letter-spacing:.02em;
    margin:2px 0 0;
    color:var(--text);
    text-wrap:balance;
  }
  header p{
    margin:2px 0 0;
    color:var(--text-sub);
    font-size:12.5px;
    line-height:1.6;
  }

  .name-box{
    margin-bottom:26px;
  }
  .name-box label{
    display:block;
    font-size:10.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-bottom:8px;
  }
  .name-box input{
    width:100%;
    padding:10px 2px;
    border:none;
    border-bottom:1px solid var(--border);
    background:transparent;
    color:var(--text);
    font-family:inherit;
    font-size:15px;
    transition:border-color .15s ease;
  }
  .name-box input::placeholder{color:var(--text-faint);}
  .name-box input:focus{
    outline:none;
    border-bottom-color:var(--accent);
  }

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:1px;
    background:var(--border-soft);
    border:1px solid var(--border-soft);
    margin-bottom:22px;
  }
  .action-btn{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    justify-content:space-between;
    gap:18px;
    padding:20px 16px;
    border:none;
    background:var(--surface);
    color:var(--text);
    font-family:inherit;
    font-size:13.5px;
    font-weight:500;
    letter-spacing:.01em;
    cursor:pointer;
    text-align:left;
    transition:background-color .15s ease;
  }
  .action-btn:hover,
  .action-btn:focus-visible{
    background:var(--surface-2);
    outline:none;
  }
  .action-btn:active{
    background:var(--surface-2);
  }
  .action-btn svg{
    width:20px;
    height:20px;
    stroke:var(--accent);
    fill:none;
    stroke-width:1.5;
  }
  .action-btn .sub{
    display:block;
    font-size:10px;
    color:var(--text-faint);
    letter-spacing:.08em;
    margin-top:2px;
    font-weight:400;
  }

  .extra-box{
    border:1px solid var(--border);
    padding:18px;
    margin-bottom:22px;
  }
  .extra-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .extra-title{
    font-size:13px;
    font-weight:500;
    color:var(--text);
  }
  .extra-cancel{
    color:var(--text-faint);
    background:none;
    border:none;
    font-family:inherit;
    font-size:11.5px;
    letter-spacing:.04em;
    cursor:pointer;
  }
  .extra-box .field{
    margin-bottom:16px;
  }
  .extra-box .field label{
    display:block;
    font-size:10.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-bottom:8px;
  }
  .extra-box .field select,
  .extra-box .field input{
    width:100%;
    padding:10px 2px;
    border:none;
    border-bottom:1px solid var(--border);
    background:transparent;
    color:var(--text);
    font-family:inherit;
    font-size:14px;
    -webkit-appearance:none;
    appearance:none;
    border-radius:0;
  }
  .extra-box .field select:focus,
  .extra-box .field input:focus{
    outline:none;
    border-bottom-color:var(--accent);
  }
  .extra-box .field input::placeholder{color:var(--text-faint);}
  .extra-next{
    width:100%;
    padding:12px;
    border:1px solid var(--accent-dim);
    background:transparent;
    color:var(--accent);
    font-family:inherit;
    font-size:13px;
    font-weight:500;
    letter-spacing:.03em;
    cursor:pointer;
    transition:background-color .15s ease, color .15s ease;
  }
  .extra-next:hover{
    background:var(--accent);
    color:#161310;
  }

  .status{
    min-height:18px;
    margin:0 0 20px;
    font-size:12px;
    color:var(--text-sub);
    line-height:1.6;
  }
  .status.is-error{color:var(--danger);}

  #log h2{
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin:0 0 12px;
    font-weight:500;
  }
  #logList{
    border-top:1px solid var(--border-soft);
  }
  .entry{
    display:flex;
    gap:14px;
    align-items:center;
    padding:14px 2px;
    border-bottom:1px solid var(--border-soft);
  }
  .entry img{
    width:44px;height:44px;
    border-radius:2px;
    object-fit:cover;
    background:var(--surface-2);
    flex-shrink:0;
  }
  .entry .info{flex:1;min-width:0;}
  .entry .row1{
    display:flex;
    align-items:baseline;
    gap:8px;
    font-size:13px;
  }
  .entry .type-label{
    font-weight:500;
    color:var(--text);
  }
  .entry .staff{
    color:var(--text-sub);
    font-size:12px;
  }
  .entry .meta{
    font-size:11px;
    color:var(--text-faint);
    margin-top:3px;
    line-height:1.5;
    word-break:break-all;
    font-variant-numeric:tabular-nums;
  }
  .entry .sync{
    font-size:10px;
    letter-spacing:.04em;
  }
  .entry .sync.ok{color:var(--ok);}
  .entry .sync.pending{color:var(--text-faint);}

  .empty{
    color:var(--text-faint);
    font-size:12.5px;
    padding:28px 2px;
    border-bottom:1px solid var(--border-soft);
  }

  /* camera modal */
  #cameraModal{
    position:fixed;inset:0;background:#000;display:none;
    flex-direction:column;z-index:50;
  }
  #cameraModal.open{display:flex;}
  #cameraModal video{flex:1;min-height:0;width:100%;object-fit:cover;background:#000;}
  #cameraModal canvas{display:none;}
  .cam-bar{
    flex-shrink:0;
    padding:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:28px;
    background:#000;
  }
  .cam-shot{
    width:60px;height:60px;border-radius:50%;
    background:transparent;
    border:1.5px solid var(--accent);
    position:relative;
    cursor:pointer;
  }
  .cam-shot::after{
    content:"";
    position:absolute;
    inset:6px;
    border-radius:50%;
    background:var(--accent);
  }
  .cam-cancel{
    color:var(--text-sub);
    background:none;
    border:none;
    font-family:inherit;
    font-size:13px;
    letter-spacing:.04em;
    cursor:pointer;
  }
  .cam-hint{
    flex-shrink:0;
    color:var(--text-sub);
    font-size:11.5px;
    letter-spacing:.02em;
    text-align:center;
    padding:12px 20px 0;
  }

  footer{
    color:var(--text-faint);
    font-size:10.5px;
    letter-spacing:.03em;
    padding-top:24px;
    line-height:1.7;
  }
  button{font-family:inherit;}
</style>
</head>
<body>

<div class="app">
  <header>
    <span class="eyebrow">NEXT VISION Inc.</span>
    <h1>勤怠確認</h1>
    <p>起床・出勤・移動・退勤を、位置情報と本人写真であわせて記録します</p>
  </header>

  <div class="name-box">
    <label for="staffName">氏名</label>
    <input type="text" id="staffName" placeholder="山田太郎" autocomplete="name">
  </div>

  <div class="grid">
    <button class="action-btn" data-type="wakeup" data-label="起床確認">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18h16M6 18a6 6 0 0 1 12 0M12 4v3M5 9l2 2M19 9l-2 2"/></svg>
      <span>起床確認<span class="sub">WAKE UP</span></span>
    </button>
    <button class="action-btn" data-type="checkin" data-label="出勤確認">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V6l7-3 7 3v15M5 21h14M10 21v-6h4v6M12 9h.01"/></svg>
      <span>出勤確認<span class="sub">CHECK IN</span></span>
    </button>
    <button class="action-btn" data-type="move" data-label="移動確認">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.4 7-11.5A7 7 0 0 0 5 9.5C5 14.6 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.2"/></svg>
      <span>移動確認<span class="sub">LOCATION</span></span>
    </button>
    <button class="action-btn" data-type="checkout" data-label="退勤確認">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v18M6 4h11l-2.5 3.5L17 11H6"/></svg>
      <span>退勤確認<span class="sub">CHECK OUT</span></span>
    </button>
  </div>

  <div class="extra-box" id="extraBox" hidden>
    <div class="extra-head">
      <span class="extra-title" id="extraTitle">出勤確認</span>
      <button type="button" class="extra-cancel" id="extraCancel">キャンセル</button>
    </div>
    <div class="field">
      <label for="transportMethod">移動手段(任意)</label>
      <select id="transportMethod">
        <option value="">選択しない</option>
        <option value="徒歩">徒歩</option>
        <option value="自転車">自転車</option>
        <option value="バイク">バイク</option>
        <option value="車">車</option>
        <option value="電車">電車</option>
        <option value="バス">バス</option>
        <option value="タクシー">タクシー</option>
        <option value="その他">その他</option>
      </select>
    </div>
    <div class="field">
      <label for="routeInput">経路(任意)</label>
      <input type="text" id="routeInput" placeholder="例: 自宅 → 〇〇商事">
    </div>
    <div class="field">
      <label for="amountInput">金額(任意・円)</label>
      <input type="number" id="amountInput" inputmode="numeric" min="0" placeholder="例: 500">
    </div>
    <button type="button" class="extra-next" id="extraNext">位置情報・撮影へ進む</button>
  </div>

  <div class="status" id="status"></div>

  <section id="log">
    <h2>記録</h2>
    <div id="logList"><div class="empty">まだ記録がありません</div></div>
  </section>

  <footer>
    試作版。サーバー未設定の場合は端末内(localStorage)にのみ保存されます。<br>
    位置情報とカメラを許可できない場合、記録は行われません。
  </footer>
</div>

<div id="cameraModal">
  <video id="video" autoplay playsinline muted></video>
  <p class="cam-hint" id="camHint">本人確認のため顔が写るように撮影してください</p>
  <div class="cam-bar">
    <button class="cam-cancel" id="camCancel">キャンセル</button>
    <button class="cam-shot" id="camShot" aria-label="撮影"></button>
  </div>
  <canvas id="canvas"></canvas>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
