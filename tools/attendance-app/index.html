<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>勤怠確認</title>
<link rel="manifest" href="manifest.json?v=2">
<link rel="icon" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<meta name="theme-color" content="#111013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="勤怠確認">
<style>
  :root{
    --bg:#111013;
    --surface:#18171b;
    --surface-2:#201f24;
    --border:#2e2c31;
    --border-soft:#26242a;
    --text:#f1efe9;
    --text-sub:#938f92;
    --text-faint:#615e63;
    --accent:#c7a15f;
    --accent-dim:#8a7548;
    --ok:#7fae8e;
    --danger:#c47a6c;
  }
  *{box-sizing:border-box;}
  html,body{background:var(--bg);}
  body{
    margin:0;
    font-family:"Meiryo","メイリオ",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }

  .app{
    max-width:440px;
    margin:0 auto;
    padding:36px 22px 48px;
  }

  header{
    padding-bottom:22px;
    border-bottom:1px solid var(--border-soft);
    margin-bottom:28px;
  }
  header h1{
    font-family:inherit;
    font-weight:600;
    font-size:21px;
    letter-spacing:.02em;
    margin:0;
    color:var(--text);
    text-wrap:balance;
  }

  .name-box{
    margin-bottom:26px;
  }
  .name-box label{
    display:block;
    font-size:10.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-bottom:8px;
  }
  .name-box input{
    width:100%;
    padding:10px 2px;
    border:none;
    border-bottom:1px solid var(--border);
    background:transparent;
    color:var(--text);
    font-family:inherit;
    font-size:15px;
    transition:border-color .15s ease;
  }
  .name-box input::placeholder{color:var(--text-faint);}
  .name-box input:focus{
    outline:none;
    border-bottom-color:var(--accent);
  }

  .login-box{
    margin-top:8px;
  }
  .login-box .name-box{
    margin-bottom:18px;
  }
  .login-btn{
    width:100%;
    padding:12px;
    border:1px solid var(--accent-dim);
    background:transparent;
    color:var(--accent);
    font-family:inherit;
    font-size:13px;
    font-weight:500;
    letter-spacing:.03em;
    cursor:pointer;
    transition:background-color .15s ease, color .15s ease;
  }
  .login-btn:hover{background:var(--accent);color:#161310;}
  #loginError{margin-top:12px;margin-bottom:0;}

  .session-box{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:8px 0 22px;
    padding-bottom:16px;
    border-bottom:1px solid var(--border-soft);
  }
  .session-name{
    font-size:14px;
    font-weight:500;
    color:var(--text);
  }
  .logout-btn{
    color:var(--text-faint);
    background:none;
    border:none;
    font-family:inherit;
    font-size:11.5px;
    letter-spacing:.04em;
    cursor:pointer;
  }
  .logout-btn:hover{color:var(--text-sub);}

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:22px;
  }
  .action-btn{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:26px 12px;
    border:1px solid var(--border-soft);
    background:var(--surface);
    color:var(--text);
    font-family:inherit;
    font-size:13.5px;
    font-weight:500;
    letter-spacing:.01em;
    cursor:pointer;
    text-align:center;
    transition:background-color .15s ease, border-color .15s ease;
  }
  .action-btn:hover,
  .action-btn:focus-visible{
    background:var(--surface-2);
    border-color:var(--border);
    outline:none;
  }
  .action-btn:active{
    background:var(--surface-2);
  }
  .action-btn svg{
    width:22px;
    height:22px;
    stroke:var(--accent);
    fill:none;
    stroke-width:1.5;
  }

  .extra-box{
    border:1px solid var(--border);
    padding:18px;
    margin-bottom:22px;
  }
  .extra-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .extra-title{
    font-size:13px;
    font-weight:500;
    color:var(--text);
  }
  .extra-cancel{
    color:var(--text-faint);
    background:none;
    border:none;
    font-family:inherit;
    font-size:11.5px;
    letter-spacing:.04em;
    cursor:pointer;
  }
  .extra-box .field{
    margin-bottom:16px;
  }
  .extra-box .field label{
    display:block;
    font-size:10.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-bottom:8px;
  }
  .extra-box .field label .req{color:var(--danger);text-transform:none;letter-spacing:0;}
  .extra-box .field select,
  .extra-box .field input{
    width:100%;
    padding:10px 2px;
    border:none;
    border-bottom:1px solid var(--border);
    background:transparent;
    color:var(--text);
    font-family:inherit;
    font-size:14px;
    -webkit-appearance:none;
    appearance:none;
    border-radius:0;
  }
  .extra-box .field select:focus,
  .extra-box .field input:focus{
    outline:none;
    border-bottom-color:var(--accent);
  }
  .extra-box .field input::placeholder{color:var(--text-faint);}
  .extra-next{
    width:100%;
    padding:12px;
    border:1px solid var(--accent-dim);
    background:transparent;
    color:var(--accent);
    font-family:inherit;
    font-size:13px;
    font-weight:500;
    letter-spacing:.03em;
    cursor:pointer;
    transition:background-color .15s ease, color .15s ease;
  }
  .extra-next:hover{
    background:var(--accent);
    color:#161310;
  }

  .status{
    min-height:18px;
    margin:0 0 20px;
    font-size:12px;
    color:var(--text-sub);
    line-height:1.6;
  }
  .status.is-error{color:var(--danger);}

  .today-log{margin-top:8px;}
  .today-log-title{
    font-size:10.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-bottom:10px;
  }
  .today-log-list{display:flex;flex-direction:column;gap:8px;}
  .today-log-empty{font-size:12px;color:var(--text-faint);}
  .today-log-item{
    background:var(--surface);
    border:1px solid var(--border-soft);
    padding:12px 14px;
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    align-items:baseline;
    gap:4px 10px;
  }
  .today-log-item .label{font-size:13px;color:var(--text);}
  .today-log-item .time{font-size:13px;font-variant-numeric:tabular-nums;color:var(--accent);}
  .today-log-item .sub{font-size:10.5px;color:var(--text-sub);margin-top:4px;flex-basis:100%;}
  .today-log-item.pending .time{color:var(--text-faint);}

  /* camera modal */
  #cameraModal{
    position:fixed;inset:0;background:#000;display:none;
    flex-direction:column;z-index:50;
  }
  #cameraModal.open{display:flex;}
  #cameraModal video{flex:1;min-height:0;width:100%;object-fit:cover;background:#000;}
  #cameraModal canvas{display:none;}
  .cam-bar{
    flex-shrink:0;
    padding:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:28px;
    background:#000;
  }
  .cam-shot{
    width:60px;height:60px;border-radius:50%;
    background:transparent;
    border:1.5px solid var(--accent);
    position:relative;
    cursor:pointer;
  }
  .cam-shot::after{
    content:"";
    position:absolute;
    inset:6px;
    border-radius:50%;
    background:var(--accent);
  }
  .cam-cancel{
    color:var(--text-sub);
    background:none;
    border:none;
    font-family:inherit;
    font-size:13px;
    letter-spacing:.04em;
    cursor:pointer;
  }
  .cam-hint{
    flex-shrink:0;
    color:var(--text-sub);
    font-size:11.5px;
    letter-spacing:.02em;
    text-align:center;
    padding:12px 20px 0;
  }

  footer{
    color:var(--text-faint);
    font-size:10.5px;
    letter-spacing:.03em;
    padding-top:24px;
    line-height:1.7;
  }
  button{font-family:inherit;}
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>勤怠確認</h1>
  </header>

  <div class="login-box" id="loginBox">
    <div class="name-box">
      <label for="loginId">ID</label>
      <input type="text" id="loginId" placeholder="staff0001" autocomplete="username">
    </div>
    <div class="name-box">
      <label for="loginPassword">パスワード</label>
      <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button type="button" class="login-btn" id="loginBtn">ログイン</button>
    <div class="status" id="loginError"></div>
  </div>

  <div id="appBody" hidden>

  <div class="session-box">
    <span class="session-name" id="sessionName"></span>
    <button type="button" class="logout-btn" id="logoutBtn">ログアウト</button>
  </div>

  <div class="grid">
    <button class="action-btn" data-type="wakeup" data-label="起床確認">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18h16M6 18a6 6 0 0 1 12 0M12 4v3M5 9l2 2M19 9l-2 2"/></svg>
      <span>起床確認</span>
    </button>
    <button class="action-btn" data-type="checkin" data-label="出勤確認">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V6l7-3 7 3v15M5 21h14M10 21v-6h4v6M12 9h.01"/></svg>
      <span>出勤確認</span>
    </button>
    <button class="action-btn" data-type="move" data-label="移動確認">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.4 7-11.5A7 7 0 0 0 5 9.5C5 14.6 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.2"/></svg>
      <span>移動確認</span>
    </button>
    <button class="action-btn" data-type="checkout" data-label="退勤確認">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v18M6 4h11l-2.5 3.5L17 11H6"/></svg>
      <span>退勤確認</span>
    </button>
  </div>

  <div class="extra-box" id="extraBox" hidden>
    <div class="extra-head">
      <span class="extra-title" id="extraTitle">出勤確認</span>
      <button type="button" class="extra-cancel" id="extraCancel">キャンセル</button>
    </div>
    <div class="field">
      <label for="transportMethod">移動手段 <span class="req">*</span></label>
      <select id="transportMethod">
        <option value="">選択してください</option>
        <option value="徒歩">徒歩</option>
        <option value="自転車">自転車</option>
        <option value="バイク">バイク</option>
        <option value="車">車</option>
        <option value="電車・バス">電車・バス</option>
        <option value="タクシー">タクシー</option>
        <option value="その他">その他</option>
      </select>
    </div>
    <div class="field">
      <label for="routeInput">経路 <span class="req">*</span></label>
      <input type="text" id="routeInput" placeholder="例: 自宅 → 〇〇商事">
    </div>
    <div class="field">
      <label for="amountInput">金額(円) <span class="req">*</span></label>
      <input type="number" id="amountInput" inputmode="numeric" min="0" placeholder="例: 500">
    </div>
    <div class="status" id="extraStatus"></div>
    <button type="button" class="extra-next" id="extraNext">位置情報・撮影へ進む</button>
  </div>

  <div class="status" id="status"></div>

  <div class="today-log">
    <div class="today-log-title">本日の記録</div>
    <div class="today-log-list" id="todayLogList"></div>
  </div>

  </div>

  <footer>
    位置情報とカメラを許可できない場合、記録は行われません。
  </footer>
</div>

<div id="cameraModal">
  <video id="video" autoplay playsinline muted></video>
  <p class="cam-hint" id="camHint">本人確認のため顔が写るように撮影してください</p>
  <div class="cam-bar">
    <button class="cam-cancel" id="camCancel">キャンセル</button>
    <button class="cam-shot" id="camShot" aria-label="撮影"></button>
  </div>
  <canvas id="canvas"></canvas>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
