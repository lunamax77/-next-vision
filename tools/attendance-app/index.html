<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>勤怠確認(試作)</title>
<style>
  :root{
    --bg:#0f1115;
    --card:#181b22;
    --border:#2a2e38;
    --text:#eef0f4;
    --sub:#9aa1ae;
    --accent:#3b82f6;
    --ok:#22c55e;
    --warn:#f59e0b;
    --danger:#ef4444;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:40px;
  }
  header{
    padding:20px 16px 8px;
    text-align:center;
  }
  header h1{
    font-size:18px;
    margin:0 0 4px;
  }
  header p{
    margin:0;
    color:var(--sub);
    font-size:12px;
  }
  main{
    max-width:480px;
    margin:0 auto;
    padding:12px 16px;
  }
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin:16px 0 24px;
  }
  .action-btn{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:20px 8px;
    border-radius:14px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .action-btn .icon{font-size:26px;}
  .action-btn[data-type="wakeup"]{border-color:#f59e0b55;}
  .action-btn[data-type="checkin"]{border-color:#22c55e55;}
  .action-btn[data-type="move"]{border-color:#3b82f655;}
  .action-btn[data-type="checkout"]{border-color:#ef444455;}

  .status{
    font-size:12px;
    color:var(--sub);
    min-height:16px;
    margin:4px 0 12px;
    text-align:center;
  }

  #log h2{font-size:14px;color:var(--sub);margin:0 0 8px;font-weight:600;}
  .entry{
    display:flex;
    gap:10px;
    padding:10px;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--card);
    margin-bottom:8px;
    align-items:center;
  }
  .entry img{
    width:52px;height:52px;border-radius:8px;object-fit:cover;background:#000;
  }
  .entry .info{flex:1;min-width:0;}
  .entry .label{font-weight:600;font-size:13px;}
  .entry .meta{font-size:11px;color:var(--sub);line-height:1.5;word-break:break-all;}
  .badge{
    display:inline-block;
    font-size:10px;
    padding:2px 6px;
    border-radius:999px;
    margin-right:6px;
  }
  .badge.wakeup{background:#f59e0b33;color:#f59e0b;}
  .badge.checkin{background:#22c55e33;color:#22c55e;}
  .badge.move{background:#3b82f633;color:#3b82f6;}
  .badge.checkout{background:#ef444433;color:#ef4444;}

  .empty{color:var(--sub);font-size:13px;text-align:center;padding:24px 0;}

  /* camera modal */
  #cameraModal{
    position:fixed;inset:0;background:#000;display:none;
    flex-direction:column;z-index:50;
  }
  #cameraModal.open{display:flex;}
  #cameraModal video{flex:1;width:100%;object-fit:cover;background:#000;}
  #cameraModal canvas{display:none;}
  .cam-bar{
    padding:16px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    background:#000;
  }
  .cam-shot{
    width:64px;height:64px;border-radius:50%;
    background:#fff;border:4px solid #666;
  }
  .cam-cancel{
    color:#fff;background:none;border:none;font-size:14px;
  }
  .cam-hint{
    color:#fff;font-size:12px;text-align:center;padding:8px 16px 0;opacity:.8;
  }

  footer{
    text-align:center;color:var(--sub);font-size:11px;padding:24px 16px;
  }
  button{font-family:inherit;}
</style>
</head>
<body>

<header>
  <h1>勤怠確認(試作)</h1>
  <p>起床・出勤・移動・退勤を GPS + 写真で記録します</p>
</header>

<main>
  <div class="grid">
    <button class="action-btn" data-type="wakeup" data-label="起床確認">
      <span class="icon">🌅</span>起床確認
    </button>
    <button class="action-btn" data-type="checkin" data-label="出勤確認">
      <span class="icon">🏢</span>出勤確認
    </button>
    <button class="action-btn" data-type="move" data-label="移動確認">
      <span class="icon">🚗</span>移動確認
    </button>
    <button class="action-btn" data-type="checkout" data-label="退勤確認">
      <span class="icon">🏁</span>退勤確認
    </button>
  </div>

  <div class="status" id="status"></div>

  <section id="log">
    <h2>記録</h2>
    <div id="logList"><div class="empty">まだ記録がありません</div></div>
  </section>
</main>

<footer>
  試作版・端末内(localStorage)にのみ保存。外部送信は行いません。
</footer>

<div id="cameraModal">
  <video id="video" autoplay playsinline muted></video>
  <p class="cam-hint" id="camHint">本人確認のため顔が写るように撮影してください</p>
  <div class="cam-bar">
    <button class="cam-cancel" id="camCancel">キャンセル</button>
    <button class="cam-shot" id="camShot" aria-label="撮影"></button>
  </div>
  <canvas id="canvas"></canvas>
</div>

<script src="app.js"></script>
</body>
</html>
