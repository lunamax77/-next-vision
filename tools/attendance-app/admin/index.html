<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本日の状況 | 勤怠管理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <header>
    <div>
      <span class="eyebrow">NEXT VISION Inc. / Admin</span>
      <h1 id="pageTitle">本日の出勤状況</h1>
    </div>
    <nav>
      <a href="index.html" class="active">本日の状況</a>
      <a href="accounts.html">アカウント管理</a>
    </nav>
  </header>

  <div class="status" id="status">読み込み中...</div>

  <div id="groups"></div>
</div>

<script>
const TYPES = [
  { key: "wakeup", label: "起床確認" },
  { key: "checkin", label: "出勤確認" },
  { key: "move", label: "移動確認" },
  { key: "checkout", label: "退勤確認" },
];

function formatTime(iso) {
  if (!iso) return "";
  const d = new Date(iso.replace(" ", "T") + "Z");
  return d.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
}

function renderChip(entry, typeInfo) {
  if (!entry) {
    return `
      <div class="status-chip empty">
        <div class="status-chip-label">${typeInfo.label}</div>
        <div class="status-chip-empty">未記録</div>
      </div>`;
  }
  const img = entry.photo_url
    ? `<img class="status-chip-photo" src="${entry.photo_url}" alt="">`
    : '<div class="status-chip-photo placeholder"></div>';
  const warn = entry.location_mismatch
    ? '<div class="warn-badge">⚠ 最寄駅から離れています</div>'
    : "";
  const mapLink = entry.maps_url
    ? `<a href="${entry.maps_url}" target="_blank" rel="noopener">地図</a>`
    : "";
  const tripParts = [];
  if (entry.route) tripParts.push(entry.route);
  if (entry.transport_method) tripParts.push(entry.transport_method);
  if (entry.amount !== null && entry.amount !== undefined) {
    tripParts.push(`&yen;${Number(entry.amount).toLocaleString("ja-JP")}`);
  }
  return `
    <div class="status-chip ${entry.location_mismatch ? "mismatch" : ""}">
      <div class="status-chip-label">${typeInfo.label}</div>
      ${img}
      <div class="status-chip-time">${formatTime(entry.time)}</div>
      ${warn}
      ${tripParts.length ? `<div class="status-chip-sub">${tripParts.join(" ・ ")}</div>` : ""}
      ${entry.address ? `<div class="status-chip-sub">${entry.address}</div>` : ""}
      ${mapLink ? `<div class="status-chip-sub">${mapLink}</div>` : ""}
    </div>`;
}

function renderStaffCard(s) {
  const primaryPhoto = (s.checkin && s.checkin.photo_url) || (s.wakeup && s.wakeup.photo_url) || null;
  const photoHtml = primaryPhoto
    ? `<img class="staff-photo" src="${primaryPhoto}" alt="">`
    : '<div class="staff-photo placeholder"></div>';
  const metaParts = [s.login_id];
  if (s.nearest_station) metaParts.push(`最寄駅: ${s.nearest_station}`);

  return `
    <div class="staff-card">
      <div class="staff-card-head">
        ${photoHtml}
        <div>
          <div class="staff-card-name">${s.display_name}</div>
          <div class="staff-card-meta">${metaParts.join(" ・ ")}</div>
        </div>
      </div>
      <div class="status-row">
        ${TYPES.map((t) => renderChip(s[t.key], t)).join("")}
      </div>
    </div>`;
}

async function load() {
  const statusEl = document.getElementById("status");
  const groupsEl = document.getElementById("groups");
  try {
    const res = await fetch("../server/admin_api/today.php");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "unknown error");

    document.getElementById("pageTitle").textContent = `本日の出勤状況(${data.date})`;

    if (data.staff.length === 0) {
      statusEl.textContent = "有効なスタッフアカウントがありません。アカウント管理から発行してください。";
      return;
    }

    const groups = new Map();
    data.staff.forEach((s) => {
      const key = s.group_name || "グループ未設定";
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(s);
    });

    groupsEl.innerHTML = [...groups.entries()]
      .map(
        ([groupName, members]) => `
          <section class="group-section">
            <h2 class="group-title">${groupName}</h2>
            <div class="staff-grid">
              ${members.map(renderStaffCard).join("")}
            </div>
          </section>`
      )
      .join("");

    statusEl.textContent = "";
  } catch (err) {
    statusEl.textContent = "読み込みに失敗しました: " + err.message;
    statusEl.classList.add("is-error");
  }
}

load();
</script>
</body>
</html>
