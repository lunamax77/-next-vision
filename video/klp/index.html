html, body { margin: 0; padding: 0; background: #000; }

  font-family: "Dela", "Noto Color Emoji", sans-serif; }
.scene { position: absolute; inset: 0; overflow: hidden; display: none; }
.abs { position: absolute; left: 0; top: 0; }
.fill { position: absolute; inset: 0; }
.dark { background: radial-gradient(ellipse at 50% 42%, #22306A 0%, #0C1230 45%, #05070F 85%); }
.vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.65) 100%); pointer-events: none; }
.burst { position: absolute; left: 50%; top: 50%; width: 3400px; height: 3400px; margin: -1700px 0 0 -1700px;
  background: repeating-conic-gradient(rgba(255,255,255,.07) 0deg 6deg, rgba(255,255,255,0) 6deg 14deg); }
.floor { position: absolute; left: -1000px; width: 3920px; top: 640px; height: 900px; transform-origin: 50% 0;

  background-image: linear-gradient(rgba(34,228,255,.75) 3px, transparent 3px), linear-gradient(90deg, rgba(34,228,255,.75) 3px, transparent 3px);

.floorfade { position: absolute; left: 0; right: 0; top: 600px; height: 200px; background: linear-gradient(#0C1230, rgba(12,18,48,0)); }
.tx { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1.15; color: #fff;
  -webkit-text-stroke: 16px var(--red); paint-order: stroke fill; text-shadow: 10px 12px 0 #000; }
.tx.y { color: var(--yel); -webkit-text-stroke-color: #000; text-shadow: 10px 12px 0 var(--red); }
.em { -webkit-text-stroke: 0; font-family: "Noto Color Emoji"; text-shadow: none; }
.banner { position: absolute; left: 0; top: 0; height: 190px; background: linear-gradient(90deg, #B80F1C, var(--red));
  box-shadow: 0 0 0 8px #000, 0 0 60px rgba(255,45,58,.6); }
.panel { position: absolute; left: 0; top: 0; background: #fff; overflow: hidden; border: 12px solid var(--red);
  box-shadow: 0 0 0 8px #000, 0 0 80px rgba(255,45,58,.75); }
.panel > i { position: absolute; inset: -12%; background: center/72% no-repeat; }
.streak { position: absolute; left: 0; top: 0; border-radius: 6px; }
.pr { position: absolute; left: 0; top: 0; width: 22px; height: 12px; }
#wipe { position: absolute; left: 0; top: -100px; width: 3200px; height: 1280px; display: none; z-index: 50; }
#wipe div { position: absolute; top: 0; height: 100%; transform: skewX(-22deg); }
.plate { position: absolute; left: 0; top: 0; background: var(--yel); color: #000; white-space: nowrap;
  padding: 10px 70px 18px; box-shadow: 0 0 0 8px #000, 12px 14px 0 8px var(--red); line-height: 1.1; }
</style>
</head>

<script>
const DURATION = 28, FPS = 30;
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = k => 1 - Math.pow(1 - k, 3);
const eInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eBack = k => { const c = 1.9, d = c + 1; return k <= 0 ? 0 : 1 + d * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// 中心座標(x,y)に配置。sk はイタリック風の傾き
function put(el, x, y, s = 1, r = 0, o = 1, sk = 0) {
  el.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%) rotate(${r}deg) skewX(${sk}deg) scale(${s})`;
  el.style.opacity = o;
}
const SK = -10;
// 横からスライドイン(スピード感)
function slideIn(el, t, a, x, y, from = -1, b = 1e9, sk = SK) {
  if (t < a || t > b) { el.style.opacity = 0; return; }
  const k = eOut(prog(t, a, a + .32)), ko = b < 1e8 ? eInOut(prog(t, b - .2, b)) : 0;
  put(el, x + from * (1 - k) * 1400 - from * ko * 1400, y, 1, 0, 1, sk + (1 - k) * -18 * from);
}
function popIn(t, a, b = 1e9, dur = .4) {
  if (t < a || t > b) return 0;
  const k = eBack(prog(t, a, a + dur));
  const out = b < 1e8 ? 1 - eOut(prog(t, b - .18, b)) : 1;
  return Math.max(0, k * out);
}

// ---------- 生成物 ----------
const STREAK_C = ['#22E4FF', '#ffffff', '#FF2D3A', '#FFD400'];
function makeStreaks(host, n, seed, radial) {
  const R = rng(seed), arr = [];
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div'); d.className = 'streak'; host.appendChild(d);
    const c = STREAK_C[i % STREAK_C.length];
    d.style.background = c; d.style.boxShadow = `0 0 18px ${c}`;
    arr.push({ el: d, a: R() * 360, off: R(), w: 160 + R() * 320, h: 5 + R() * 7, y: 60 + R() * 960 });
  }
  return arr;
}
function radialStreaks(arr, t, cx, cy, sp = 1.6) {
  arr.forEach(l => { const d = (t * sp + l.off) % 1;
    l.el.style.cssText += `left:${cx}px;top:${cy}px;width:${l.w * (0.4 + d)}px;height:${l.h}px;opacity:${(1 - d) * .95};transform-origin:0 50%;transform:rotate(${l.a}deg) translateX(${220 + d * 1200}px);`; });
}
function flowStreaks(arr, t, sp = 2.5, op = .8) {
  arr.forEach(l => { const d = (t * sp + l.off) % 1;
    l.el.style.cssText += `left:${1920 - d * 2600}px;top:${l.y}px;width:${l.w * 1.6}px;height:${l.h}px;opacity:${op};transform:none;`; });
}
const s1lines = makeStreaks($('s1lines'), 34, 3);
const s2lines = makeStreaks($('s2lines'), 26, 5);
const s6lines = makeStreaks($('s6lines'), 18, 7);
const s7lines = makeStreaks($('s7lines'), 26, 9);

// コース: コーンとゴールの市松
const track = $('track'), TL = track.getTotalLength();
const conesG = $('cones'), coneF = [0.14, 0.27, 0.40, 0.53, 0.66, 0.79];
coneF.forEach((f, i) => {
  const p = track.getPointAtLength(f * TL), q = track.getPointAtLength(Math.min(TL, f * TL + 2));
  const ang = Math.atan2(q.y - p.y, q.x - p.x), side = i % 2 ? 1 : -1;
  const x = p.x - Math.sin(ang) * 130 * side, y = p.y + Math.cos(ang) * 130 * side;
  conesG.insertAdjacentHTML('beforeend',
    `<g transform="translate(${x} ${y})"><rect x="-38" y="16" width="76" height="16" rx="6" fill="#E0561B"/>
     <path d="M-28 20 L-9 -52 L9 -52 L28 20 Z" fill="#FF7A1A"/><path d="M-21 -6 L21 -6 L17 -22 L-17 -22 Z" fill="#fff"/></g>`);
});
for (let r = 0; r < 10; r++) for (let c = 0; c < 2; c++) if ((r + c) % 2)
  $('checks').insertAdjacentHTML('beforeend', `<rect x="${-24 + c * 24}" y="${-100 + r * 20}" width="24" height="20" fill="#15151D"/>`);

// 紙吹雪(ゴールド・シルバー・レッド)
const conf = [], CR = rng(42), colors = ['#FFD400', '#FFE88A', '#E6E9F2', '#FF2D3A', '#ffffff', '#22E4FF'];
for (let i = 0; i < 180; i++) { const d = document.createElement('div'); d.className = 'abs';
  const w = 18 + CR() * 22; d.style.cssText += `width:${w}px;height:${w * .5}px;background:${colors[i % colors.length]};border-radius:3px;`;
  $('confetti').appendChild(d); conf.push({ el: d, x: CR() * 1920, d: CR() * .9, v: 460 + CR() * 460, sw: CR() * 6, r: CR() * 720 - 360 }); }
function makeEmoji(host, list, size) {
  return list.map(([x, y, ch, dl]) => { const d = document.createElement('div'); d.className = 'abs em';
    d.style.fontSize = size + 'px'; d.textContent = ch; host.appendChild(d); return { el: d, x, y, dl }; });
}
const stars = makeEmoji($('s4stars'), [[180,160,'⭐',0],[1740,170,'⭐',.2],[300,930,'✨',.35],[1640,930,'✨',.1],[960,90,'🌟',.5],[110,560,'⭐',.6],[1810,560,'⭐',.45]], 120);
const claps = makeEmoji($('s4claps'), [[150,730,'👏',.9],[1770,730,'👏',1.1]], 170);
const sparks = makeEmoji($('s5spark'), [[170,330,'✨',0],[1400,300,'✨',.25],[160,950,'⭐',.4],[1500,900,'✨',.15],[1780,330,'⭐',.55],[1790,860,'✨',.7]], 110);

// ---------- シーン ----------
const scenes = [
  ['s1', 0, 3, s1], ['s2', 3, 7, s2], ['s3', 7, 12, s3], ['s4', 12, 16, s4],
  ['s5', 16, 21, s5], ['s6', 21, 25, s6], ['s7', 25, 28.01, s7],
];

function s1(t) {
  $('s1burst').style.transform = `rotate(${t * 10}deg)`;
  $('s1floor').style.backgroundPosition = `0 ${t * 600}px`;
  radialStreaks(s1lines, t, 960, 430, 1.8);
  const k = eInOut(prog(t, 0, 1.1));
  const hit = t >= 1.1, shake = hit ? Math.sin(t * 90) * 14 * Math.exp(-(t - 1.1) * 5) : 0;
  put($('s1car'), 960 + shake, 430 + shake * .6, lerp(.06, 1, k) * (hit ? 1 + .06 * Math.exp(-(t - 1.1) * 6) : 1), 0, 1, SK);
  $('s1flash').style.opacity = hit ? Math.max(0, .9 - (t - 1.1) * 4) : 0;
  put($('s1boon'), 1540 + Math.sin(t * 60) * 5, 190, popIn(t, 1.15), -8, 1, SK);
  const bk = eOut(prog(t, 1.25, 1.55));
  put($('s1bar'), lerp(-1000, 960, bk), 920, 1, 0, 1, -18);
  slideIn($('s1title'), t, 1.4, 960, 915, 1);
}

function wheelKid(t) {
  const rot = Math.sin(t * 3.4) * 26;
  $('wheel').setAttribute('transform', `translate(400 770) rotate(${rot})`);
  const hand = (deg) => { const a = (deg + rot) * Math.PI / 180; return [400 + 220 * Math.cos(a), 770 + 220 * Math.sin(a)]; };
  const [lx, ly] = hand(-150), [rx, ry] = hand(-30);
  $('handL').setAttribute('cx', lx); $('handL').setAttribute('cy', ly);
  $('handR').setAttribute('cx', rx); $('handR').setAttribute('cy', ry);
  const arm = (el, sx, sy, ex, ey) => { el.setAttribute('x1', sx); el.setAttribute('y1', sy); el.setAttribute('x2', ex); el.setAttribute('y2', ey); };
  arm($('armL'), 215, 640, lx, ly); arm($('armR'), 585, 640, rx, ry);
}
function s2(t) {
  const lt = t - 3, drive = lt >= 2.2;
  $('s2burst').style.transform = `rotate(${-t * 8}deg)`;
  // 2a アップ
  $('s2kid').style.display = drive ? 'none' : 'block';
  $('s2spot').style.display = drive ? 'none' : 'block';
  wheelKid(lt);
  put($('s2kid'), 960, lerp(720, 660, eOut(prog(lt, 0, .5))), lerp(.8, 1, eOut(prog(lt, 0, .5))));
  const bk = eOut(prog(lt, .05, .3)), bo = eInOut(prog(lt, 2.0, 2.2));
  put($('s2bar'), lerp(-900, 960, bk) + bo * 2000, 120, 1, 0, 1, -18);
  slideIn($('s2t1'), lt, .15, 960, 118, 1, 2.2);
  // 2b 走り出す
  $('s2road').style.display = $('s2car').style.display = drive ? 'block' : 'none';
  $('s2lines').style.display = drive ? 'block' : 'none';
  const dt = lt - 2.2;
  flowStreaks(s2lines, dt, 2.8, .75);
  $('s2dash').style.backgroundPosition = `${-dt * 1800}px 0`;
  const cx = lerp(-700, 800, eOut(prog(dt, 0, .6))) + dt * 60;
  const bob = Math.abs(Math.sin(dt * 14)) * -8;
  put($('s2car'), cx, 640 + bob, 1, Math.sin(dt * 14) * .6);
  $('wl1').setAttribute('transform', `translate(220 390) rotate(${dt * 1100})`);
  $('wl2').setAttribute('transform', `translate(690 390) rotate(${dt * 1100})`);
  put($('s2t2'), 1000, 220, popIn(dt, .3), -5 + Math.sin(dt * 30) * 1.2, 1, SK);
}

function s3(t) {
  const lt = t - 7, f = eInOut(prog(lt, .2, 4.7)), L = TL - 180;
  const p = track.getPointAtLength(f * L), q = track.getPointAtLength(Math.min(TL, f * L + 4));
  const ang = Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI;
  $('s3car').setAttribute('transform', `translate(${p.x} ${p.y}) rotate(${ang})`);
  const pts = [];
  for (let i = 0; i <= 24; i++) { const ff = Math.max(0, f - .1 * (1 - i / 24)); const pp = track.getPointAtLength(ff * L); pts.push(`${pp.x},${pp.y}`); }
  $('trail').setAttribute('points', pts.join(' ')); $('trailGlow').setAttribute('points', pts.join(' '));
  let amp = 0; coneF.forEach(cf => amp += 12 * Math.max(0, 1 - Math.abs(f - cf) / .035));
  const zoom = 1.12;
  const camX = clamp(960 - p.x * zoom, 1920 - 1980 * zoom + 60, 0), camY = clamp(560 - p.y * zoom, 1080 - 1080 * zoom, 0);
  $('s3cam').setAttribute('transform', `translate(${camX + Math.sin(t * 80) * amp} ${camY + Math.cos(t * 70) * amp}) scale(${zoom})`);
  slideIn($('s3t1'), lt, .1, 960, 120, 1, 2.6);
  put($('s3t2'), 960, 135, popIn(lt, 2.6), -5, 1, SK);
}

function s4(t) {
  const lt = t - 12;
  $('s4flag').style.transform = `perspective(900px) rotateY(${Math.sin(lt * 2) * 8}deg) skewY(${Math.sin(lt * 3) * 3}deg) scale(1.2)`;
  $('s4burst').style.transform = `rotate(${t * 22}deg)`;
  put($('s4t1'), 960, 420, popIn(lt, .05) * (1 + Math.sin(lt * 8) * .03), Math.sin(lt * 5) * 2, 1, SK);
  put($('s4t2'), 960, 720, popIn(lt, 1.3), 0, 1, SK);
  conf.forEach(c => { const lc = lt - c.d; const y = -60 + lc * c.v;
    put(c.el, c.x + Math.sin(lc * 3 + c.sw) * 60, y, 1, c.r * lc, lc > 0 ? 1 : 0); });
  stars.forEach(s => put(s.el, s.x, s.y, popIn(lt, s.dl) * (0.85 + .2 * Math.sin(lt * 7 + s.x)), lt * 30));
  claps.forEach(s => put(s.el, s.x, s.y + Math.abs(Math.sin(lt * 10)) * -20, popIn(lt, s.dl), Math.sin(lt * 12) * 10));
}

function s5(t) {
  const lt = t - 16;
  $('s5burst').style.transform = `rotate(${t * 14}deg)`;
  const k = eBack(prog(lt, .25, .8));
  put($('s5card'), 770, 640, Math.max(0, k), lerp(-18, -2, clamp(k)) + Math.sin(lt * 2) * 1.2);
  $('s5shine').style.transform = `translateX(${lerp(-400, 1300, prog(lt, 1.0, 1.9))}px) rotate(20deg)`;
  put($('s5jan'), 1580, 560, popIn(lt, .7, 2.6), 8 + Math.sin(lt * 20) * 2, 1, SK);
  sparks.forEach(s => put(s.el, s.x, s.y, popIn(lt, .8 + s.dl) * (.8 + .25 * Math.sin(lt * 8 + s.y)), lt * 40));
  slideIn($('s5t1'), lt, .05, 960, 120, 1, 2.8);
  slideIn($('s5t2'), lt, 2.8, 960, 120, -1);
}

function s6(t) {
  const lt = t - 21;
  $('s6floor').style.backgroundPosition = `0 ${t * 400}px`;
  flowStreaks(s6lines, lt, 1.2, .45);
  slideIn($('s6p'), lt, .05, 960, 80, -1);
  slideIn($('s6title'), lt, .2, 960, 210, 1);
  const dk = eBack(prog(lt, .55, 1.0));
  put($('s6date'), 960, 420, Math.max(0, dk), 0, 1, -12);
  slideIn($('s6place'), lt, .9, 960, 610, -1);
  document.querySelectorAll('.s6car').forEach((el, i) => {
    const k = eOut(prog(lt, 1.2 + i * .12, 1.6 + i * .12));
    put(el, lerp(2400, 450 + i * 340, k), 885 + Math.sin(lt * 9 + i) * 5, 1, 0, 1, SK);
  });
}

function s7(t) {
  const lt = t - 25;
  $('s7floor').style.backgroundPosition = `0 ${t * 900}px`;
  const go = eInOut(prog(lt, .9, 1.5));
  flowStreaks(s7lines, lt, go > 0 ? 4 : 1.8, .85);
  const car = $('s7car');
  put(car, lerp(960, 2600, go) + Math.sin(lt * 50) * 3, 530 + Math.abs(Math.sin(lt * 12)) * -10, popIn(lt, 0), 0, 1, SK);
  car.style.filter = go > 0 ? `blur(${go * 8}px)` : 'none';
  slideIn($('s7t1'), lt, .05, 960, 150, 1);
  slideIn($('s7t2'), lt, .35, 960, 935, -1);
  // 最後の画面(固定表示)
  const e = lt >= 1.6;
  $('s7end').style.display = e ? 'block' : 'none';
  if (e) {
    const et = lt - 1.6;
    const sk = eOut(prog(et, 0, .3));
    put($('slashA'), lerp(-900, 60, sk), 540, 1, 0, 1, -22);
    put($('slashB'), lerp(-900, 560, sk), 540, 1, 0, 1, -22);
    put($('slashC'), lerp(-900, 660, sk), 540, 1, 0, 1, -22);
    put($('e1'), 960, 290, popIn(et, .08), 0, 1, SK);
    slideIn($('e2'), et, .18, 960, 450, 1);
    put($('e3'), 960, 660, popIn(et, .28), 0, 1, -12);
    slideIn($('e4'), et, .38, 960, 880, -1);
  }
}

const CUTS = [3, 7, 12, 16, 21, 25];
window.renderAt = function (t) {
  for (const [id, a, b, fn] of scenes) {
    const on = t >= a && t < b;
    const el = $(id); el.style.display = on ? 'block' : 'none';
    if (on) {
      const k = a === 0 ? 1 : eOut(prog(t - a, 0, .3));
      el.style.transform = `scale(${lerp(1.08, 1, k)})`;
      fn(t);
    }
  }
  // スラッシュワイプ
  const w = $('wipe'), c = CUTS.find(c => Math.abs(t - c) < .24);
  w.style.display = c === undefined ? 'none' : 'block';
  if (c !== undefined) w.style.transform = `translateX(${lerp(2100, -3300, (t - c + .24) / .48)}px)`;
};
window.DURATION = DURATION; window.FPS = FPS;

// ブラウザで開いたときはリアルタイム再生(ループ)
if (!navigator.webdriver) {
  const st = document.getElementById('stage');
  const fit = () => { const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    st.style.transformOrigin = '0 0'; st.style.transform = `scale(${s})`; };
  addEventListener('resize', fit); fit();
  const t0 = performance.now();
  const loop = () => { renderAt(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
  loop();
} else renderAt(0);
</script>
</body>
</html>
