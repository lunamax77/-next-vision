      <ellipse cx="105" cy="500" rx="62" ry="13" fill="#22384F" opacity=".14"/>
      <rect width="210" height="372" rx="14" fill="#FFFFFF" stroke="#E3D6C0" stroke-width="4"/>
      <rect x="12" y="12" width="186" height="348" rx="10" fill="#FEE9DC"/>
      <text x="105" y="60" text-anchor="middle" font-family="'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif" font-size="26" font-weight="700" fill="#E5624C">ぷにラボ</text>
      <text x="105" y="94" text-anchor="middle" font-family="'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif" font-size="19" font-weight="700" fill="#2C7CBF">スクイーズ作成体験</text>
      <!-- マスコット -->
      <g transform="translate(47 116) scale(.86)">
        <ellipse cx="58" cy="104" rx="58" ry="46" fill="#FBC9B2"/>
        <circle cx="58" cy="48" r="42" fill="#FBC9B2"/>
        <path d="M22 18l-6-26 28 12z" fill="#FBC9B2"/>
        <path d="M94 18l6-26-28 12z" fill="#FBC9B2"/>
        <path d="M24 16l-3-15 16 7z" fill="#F5A0B8"/>
        <path d="M92 16l3-15-16 7z" fill="#F5A0B8"/>
        <ellipse cx="58" cy="60" rx="26" ry="20" fill="#FFF3E0"/>
        <circle cx="42" cy="44" r="5" fill="#22384F"/><circle cx="74" cy="44" r="5" fill="#22384F"/>
        <circle cx="43.6" cy="42.4" r="1.8" fill="#FFFFFF"/><circle cx="75.6" cy="42.4" r="1.8" fill="#FFFFFF"/>
        <ellipse cx="58" cy="56" rx="7" ry="5" fill="#E5624C"/>
        <path d="M58 61v5M58 66q-7 6-13 0M58 66q7 6 13 0" stroke="#22384F" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <circle cx="26" cy="56" r="8" fill="#E5624C" opacity=".35"/>
        <circle cx="90" cy="56" r="8" fill="#E5624C" opacity=".35"/>
      </g>
      <rect x="24" y="286" width="162" height="24" rx="12" fill="#F5A623"/>
      <text x="105" y="303" text-anchor="middle" font-family="'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">所要 約20分 / 組</text>
      <text x="105" y="336" text-anchor="middle" font-family="'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif" font-size="14" font-weight="700" fill="#4E6274">対象 4歳〜 ／ 6畳〜</text>
    </g>

    <!-- ===== テーブル（右） ===== -->
    <g transform="translate(404 486)">
      <ellipse cx="308" cy="322" rx="330" ry="24" fill="#22384F" opacity=".16"/>
      <!-- 天板 -->
      <rect x="-10" y="0" width="636" height="42" rx="10" fill="#F0E4CE"/>
      <rect x="-10" y="30" width="636" height="15" rx="7" fill="#DACBAF"/>
      <!-- クロス -->
      <path d="M-2 44h620v262c0 8-6 14-14 14H12c-8 0-14-6-14-14z" fill="url(#sq-cloth)"/>
      <path d="M-2 44h620v22H-2z" fill="#F0765F"/>
      <text x="308" y="196" text-anchor="middle" font-family="'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif" font-size="44" font-weight="700" letter-spacing="5" fill="#FFFFFF" opacity=".92">ぷにラボ</text>
      <text x="308" y="236" text-anchor="middle" font-family="'Baloo 2','Zen Maru Gothic',sans-serif" font-size="18" letter-spacing="6" fill="#FFD9C9">PUNI LABO</text>

