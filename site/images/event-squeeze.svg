      <g transform="translate(468 -60)">
        <rect width="132" height="68" rx="7" fill="#FFFFFF" stroke="#DCD3C4" stroke-width="3"/>
        <rect x="16" y="16" width="22" height="40" rx="7" fill="#9FD3EC"/>
        <rect x="21" y="8" width="12" height="10" rx="3" fill="#3E9BD8"/>
        <rect x="55" y="16" width="22" height="40" rx="7" fill="#FBC9B2"/>
        <rect x="60" y="8" width="12" height="10" rx="3" fill="#E5624C"/>
        <rect x="94" y="16" width="22" height="40" rx="7" fill="#F2E39A"/>
        <rect x="99" y="8" width="12" height="10" rx="3" fill="#F5A623"/>
      </g>
    </g>

    <!-- ===== きらめき ===== -->
    <g fill="#F5A623" opacity=".65">
      <path d="M340 400l7 16 16 7-16 7-7 16-7-16-16-7 16-7z"/>
      <path d="M962 452l6 13 13 6-13 6-6 13-6-13-13-6 13-6z"/>
      <path d="M818 350l5 12 12 5-12 5-5 12-5-12-12-5 12-5z"/>
    </g>
  </g>
</svg>
