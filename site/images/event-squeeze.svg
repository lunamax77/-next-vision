      <rect x="206" y="170" width="118" height="166" rx="8"/>
    </g>
    <g fill="#FFFFFF" opacity=".55">
      <rect x="50" y="158" width="118" height="50" rx="5"/>
      <rect x="50" y="220" width="118" height="50" rx="5"/>
      <rect x="222" y="188" width="86" height="44" rx="5"/>
    </g>

    <!-- ===== 床 ===== -->
    <rect y="360" width="1100" height="460" fill="#E9E0D0"/>
    <g stroke="#D8CFBE" stroke-width="2.5" opacity=".7">
      <path d="M0 470H1100M0 596H1100M0 730H1100"/>
    </g>

    <!-- ===== ガーランド ===== -->
    <path d="M20 86 Q400 152 780 80" stroke="#B4A893" stroke-width="4" fill="none"/>
    <g>
      <path d="M78 100l30 5-12 32z" fill="#F5A623"/>
      <path d="M170 118l30 4-12 32z" fill="#45C4E8"/>
      <path d="M264 132l30 3-13 32z" fill="#E5624C"/>
      <path d="M360 139l30 2-13 32z" fill="#8CC97A"/>
      <path d="M456 139l30 0-14 32z" fill="#F5A623"/>
      <path d="M552 132l30-2-15 32z" fill="#45C4E8"/>
      <path d="M648 118l30-4-16 31z" fill="#E5624C"/>
