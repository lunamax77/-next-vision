      <g transform="translate(6 -50)">
        <rect width="118" height="58" rx="7" fill="#FFFFFF" stroke="#DCD3C4" stroke-width="3"/>
        <g fill="#FEE9DC" stroke="#F5A0B8" stroke-width="2.5">
          <circle cx="30" cy="20" r="11"/><circle cx="64" cy="20" r="11"/>
          <circle cx="30" cy="42" r="11"/><circle cx="64" cy="42" r="11"/>
        </g>
        <rect x="88" y="12" width="18" height="36" rx="9" fill="#9FD3EC"/>
      </g>
      <!-- 中央トレイ：スクイーズ -->
      <g transform="translate(152 -68)">
        <rect width="290" height="76" rx="8" fill="#3B4B58"/>
        <rect x="6" y="6" width="278" height="64" rx="6" fill="#4E6274"/>
        <circle cx="44" cy="26" r="15" fill="#F5A0B8"/>
        <circle cx="39" cy="22" r="2.6" fill="#22384F"/><circle cx="49" cy="22" r="2.6" fill="#22384F"/>
        <path d="M40 31q4 4 8 0" stroke="#22384F" stroke-width="2" fill="none" stroke-linecap="round"/>
        <circle cx="98" cy="24" r="14" fill="#F2C94C"/>
        <path d="M98 12l3.6 7.6 8.4 1-6 6 1.4 8.4-7.4-4-7.4 4 1.4-8.4-6-6 8.4-1z" fill="#FFF3E0"/>
        <circle cx="152" cy="26" r="15" fill="#45C4E8"/>
        <circle cx="147" cy="22" r="2.6" fill="#22384F"/><circle cx="157" cy="22" r="2.6" fill="#22384F"/>
        <ellipse cx="206" cy="26" rx="18" ry="13" fill="#8CC97A"/>
        <circle cx="252" cy="26" r="14" fill="#C9A7E8"/>
        <circle cx="70" cy="54" r="12" fill="#E5624C"/>
        <circle cx="124" cy="54" r="12" fill="#FBC9B2"/>
        <circle cx="178" cy="54" r="12" fill="#F2C94C"/>
        <ellipse cx="230" cy="52" rx="15" ry="11" fill="#F5A0B8"/>
        <circle cx="272" cy="54" r="12" fill="#45C4E8"/>
      </g>
