<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" role="img" aria-label="スクイーズ作成体験ブースのイラスト">
  <defs>
    <linearGradient id="sq-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3E0"/><stop offset="1" stop-color="#F1E4D0"/>
    </linearGradient>
    <linearGradient id="sq-cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E5624C"/><stop offset="1" stop-color="#C24E3A"/>
    </linearGradient>
    <clipPath id="sq-frame"><rect width="1100" height="820"/></clipPath>
  </defs>

  <g clip-path="url(#sq-frame)">
    <rect width="1100" height="820" fill="url(#sq-bg)"/>

    <!-- ===== 天井 ===== -->
    <rect width="1100" height="72" fill="#31414E"/>
    <g fill="#F7F2E6" opacity=".8">
      <rect x="80" y="26" width="150" height="9" rx="4.5"/>
      <rect x="420" y="20" width="190" height="9" rx="4.5"/>
      <rect x="820" y="26" width="160" height="9" rx="4.5"/>
    </g>

    <!-- ===== 奥の什器 ===== -->
    <rect y="72" width="1100" height="288" fill="#EFE0C9"/>
    <rect x="742" y="72" width="358" height="288" fill="#E5624C"/>
    <rect x="742" y="72" width="358" height="11" fill="#B94331"/>
    <g fill="#FFFFFF" opacity=".16">
      <rect x="774" y="108" width="96" height="104" rx="8"/>
      <rect x="886" y="108" width="96" height="104" rx="8"/>
      <rect x="998" y="108" width="72" height="104" rx="8"/>
      <rect x="774" y="232" width="208" height="92" rx="8"/>
