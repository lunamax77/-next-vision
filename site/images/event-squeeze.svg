    <g transform="translate(360 186)">
      <rect width="392" height="112" rx="12" fill="#3E9BD8"/>
      <rect x="8" y="8" width="376" height="96" rx="8" fill="#9FD3EC"/>
      <text x="196" y="52" text-anchor="middle" font-family="'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" stroke="#26576E" stroke-width="5" paint-order="stroke">ワークショップ</text>
      <text x="196" y="90" text-anchor="middle" font-family="'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" stroke="#26576E" stroke-width="5" paint-order="stroke">開催中！</text>
    </g>

